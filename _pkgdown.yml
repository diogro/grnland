url: https://diogro.github.io/grnland/

# Shared site layout (same in stanimal, indri, grnland, evomod2): build with
# `Rscript pkgdown/build_site.R`; the look is in pkgdown/extra.scss and only
# the accent colour below is per package. The home page is the README.
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#2c6e8f"

home:
  title: "grnland: evolution of gene regulatory networks on adaptive landscapes"
  links:
  - text: Guide for agents (AGENTS.md)
    href: https://github.com/diogro/grnland/blob/main/AGENTS.md
  - text: Developer notes (DEVELOPMENT.md)
    href: https://github.com/diogro/grnland/blob/main/DEVELOPMENT.md

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]

articles:
- title: Articles
  navbar: ~
  contents:
  - grnland
  - articles/paper-figures

reference:
- title: Networks
  desc: Genotype-phenotype maps built from gene regulatory networks.
  contents:
  - grn
  - paper_motif
  - grn_custom
  - gp_linear
  - loci_names
- title: Development and variation
  desc: From genotypes to phenotypes, and the variation mutation produces.
  contents:
  - default_genotype
  - develop
  - phenotype
  - genotype_at
  - sensitivity
  - m_matrix
- title: Landscapes
  contents:
  - landscapes
  - find_peaks
  - lande_separatrices
- title: Simulation
  contents:
  - simulate_population
  - selection
  - stop_at_peaks
  - nearest_peak
- title: Package
  contents:
  - grnland-package
